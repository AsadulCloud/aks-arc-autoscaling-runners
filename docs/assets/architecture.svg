<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>

  <rect width="1600" height="1040" fill="#0b1220"/>

  <text x="800" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#f1f5f9">AKS &amp; GitHub Actions (ARC) Auto-scaling Runners</text>

  <!-- GitHub -->
  <rect x="50" y="80" width="430" height="110" rx="14" fill="#111a2e" stroke="#94a3b8" stroke-width="2"/>
  <text x="68" y="104" font-size="15" font-weight="bold" fill="#cbd5e1">GitHub (Cloud)</text>
  <rect x="70" y="125" width="140" height="48" rx="8" fill="#0f1b33" stroke="#60a5fa" stroke-width="2"/>
  <text x="140" y="154" text-anchor="middle" font-size="14" fill="#e5edff">Actions Trigger</text>
  <rect x="270" y="125" width="180" height="48" rx="8" fill="#0f1b33" stroke="#60a5fa" stroke-width="2"/>
  <text x="360" y="147" text-anchor="middle" font-size="14" fill="#e5edff">Job Queue</text>
  <text x="360" y="164" text-anchor="middle" font-size="12" fill="#94a3b8">(matrix jobs)</text>
  <line x1="210" y1="149" x2="268" y2="149" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#aBlue)"/>

  <!-- Arrow 1: outbound poll, Listener -> Job Queue -->
  <text x="378" y="225" font-size="14" font-weight="bold" fill="#93c5fd">1. outbound HTTPS long-poll (443)</text>
  <text x="378" y="245" font-size="13" fill="#94a3b8">No inbound access, no public IP</text>

  <!-- Azure -->
  <rect x="40" y="270" width="1520" height="610" rx="16" fill="#0d1a33" stroke="#2563eb" stroke-width="2.5"/>
  <text x="62" y="300" font-size="20" font-weight="bold" fill="#93c5fd">Azure Cloud Platform</text>

  <!-- AKS -->
  <rect x="70" y="320" width="1460" height="370" rx="14" fill="#0f2040" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="90" y="348" font-size="18" font-weight="bold" fill="#bfdbfe">AKS Cluster</text>

  <!-- arc-systems -->
  <rect x="100" y="370" width="520" height="270" rx="12" fill="#0d2a2a" stroke="#10b981" stroke-width="2"/>
  <text x="120" y="395" font-size="15" font-weight="bold" fill="#6ee7b7">namespace: arc-systems</text>
  <rect x="230" y="420" width="260" height="70" rx="10" fill="#0f1b33" stroke="#34d399" stroke-width="2"/>
  <text x="360" y="450" text-anchor="middle" font-size="15" fill="#e5edff">Listener Pod</text>
  <text x="360" y="470" text-anchor="middle" font-size="12" fill="#94a3b8">(outbound polling)</text>
  <rect x="230" y="545" width="260" height="70" rx="10" fill="#0f1b33" stroke="#34d399" stroke-width="2"/>
  <text x="360" y="575" text-anchor="middle" font-size="15" fill="#e5edff">Controller Manager</text>
  <text x="360" y="595" text-anchor="middle" font-size="12" fill="#94a3b8">(creates / deletes runner pods)</text>
  <!-- Arrow 2 -->
  <line x1="360" y1="490" x2="360" y2="543" stroke="#34d399" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <text x="374" y="523" font-size="13" fill="#6ee7b7">2. reports job demand</text>

  <!-- arc-runners -->
  <rect x="760" y="370" width="420" height="270" rx="12" fill="#0d2a2e" stroke="#14b8a6" stroke-width="2"/>
  <text x="780" y="395" font-size="15" font-weight="bold" fill="#5eead4">namespace: arc-runners</text>
  <g fill="#0f1b33" stroke="#2dd4bf" stroke-width="2">
    <rect x="785" y="440" width="70" height="55" rx="10"/>
    <rect x="865" y="440" width="70" height="55" rx="10"/>
    <rect x="1050" y="440" width="70" height="55" rx="10"/>
  </g>
  <g font-size="13" fill="#e5edff" text-anchor="middle">
    <text x="820" y="473">Pod 1</text>
    <text x="900" y="473">Pod 2</text>
    <text x="1085" y="473">Pod 8</text>
  </g>
  <text x="992" y="474" text-anchor="middle" font-size="22" fill="#94a3b8">...</text>
  <text x="970" y="540" text-anchor="middle" font-size="14" fill="#e5edff">Ephemeral runners, scaled 0 to 8</text>
  <text x="970" y="562" text-anchor="middle" font-size="14" fill="#e5edff">one job per pod</text>
  <text x="970" y="590" text-anchor="middle" font-size="12" fill="#94a3b8">single-use JIT token + Docker-in-Docker sidecar</text>

  <!-- Arrows 3 and 4 -->
  <line x1="490" y1="565" x2="758" y2="565" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#aTeal)"/>
  <text x="690" y="552" text-anchor="middle" font-size="13" fill="#5eead4">3. creates pods</text>
  <line x1="758" y1="597" x2="490" y2="597" stroke="#2dd4bf" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aTeal)"/>
  <text x="690" y="618" text-anchor="middle" font-size="13" fill="#5eead4">4. pods terminate</text>

  <!-- monitoring -->
  <rect x="1280" y="370" width="220" height="270" rx="12" fill="#2a1f10" stroke="#f59e0b" stroke-width="2"/>
  <text x="1296" y="395" font-size="13" font-weight="bold" fill="#fcd34d">namespace: monitoring</text>
  <rect x="1300" y="440" width="180" height="70" rx="10" fill="#0f1b33" stroke="#fb923c" stroke-width="2"/>
  <text x="1390" y="481" text-anchor="middle" font-size="16" fill="#e5edff">Prometheus</text>
  <text x="1390" y="545" text-anchor="middle" font-size="13" fill="#fdba74">scrapes ARC metrics</text>
  <text x="1390" y="565" text-anchor="middle" font-size="13" fill="#fdba74">port 8080</text>

  <!-- Scrape arrow (dashed): Prometheus -> arc-systems -->
  <path d="M1390,640 V667 H560 V642" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#aOrange)"/>
  <text x="980" y="660" text-anchor="middle" font-size="13" fill="#fdba74">scrape metrics (listener + controller)</text>

  <!-- Blob storage inside Azure, outside AKS -->
  <rect x="1000" y="740" width="280" height="90" rx="12" fill="#2a1a0f" stroke="#f97316" stroke-width="2.5"/>
  <text x="1140" y="780" text-anchor="middle" font-size="16" font-weight="bold" fill="#fed7aa">Azure Blob Storage</text>
  <text x="1140" y="803" text-anchor="middle" font-size="13" fill="#fdba74">Terraform remote state</text>

  <!-- Terraform -->
  <rect x="100" y="930" width="220" height="70" rx="12" fill="#1a1236" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="210" y="972" text-anchor="middle" font-size="18" font-weight="bold" fill="#ddd6fe">Terraform</text>
  <line x1="210" y1="930" x2="210" y2="692" stroke="#a78bfa" stroke-width="3" marker-end="url(#aPurple)"/>
  <text x="226" y="820" font-size="14" fill="#c4b5fd">provisions</text>
  <path d="M320,965 H1140 V832" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#aPurple)"/>
  <text x="730" y="955" text-anchor="middle" font-size="14" fill="#c4b5fd">remote state</text>

  <!-- Arrow 1 drawn last so it sits on top: Listener Pod -> Job Queue -->
  <line x1="360" y1="420" x2="360" y2="175" stroke="#60a5fa" stroke-width="3.5" marker-end="url(#aBlue)"/>
</svg>
