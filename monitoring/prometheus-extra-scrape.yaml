extraScrapeConfigs: |
  - job_name: 'arc-controller'
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['arc-metrics.arc-systems.svc.cluster.local:8080']
  - job_name: 'arc-listener'
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['arc-listener-metrics.arc-systems.svc.cluster.local:8080']